services:
  mongo:
    image: mongo:7
    container_name: devmirror-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devmirror-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_DSN: mongodb://mongo:27017
      MONGO_DATABASE: devmirror_mock_service
      APP_NAME: DevMirror Mock Service
      APP_VERSION: 0.1.0
      DEFAULT_SCOPE: global
      SCOPE_HEADER_NAME: user-id
      SCOPE_BODY_FIELD_NAME: pinEq
      ADMIN_PREFIX: /_admin/mocks
      HEALTH_PREFIX: /_health
    ports:
      - "8000:8000"

volumes:
  mongo_data:
